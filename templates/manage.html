<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>체크 입력</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { display:flex; height:100vh; }
    .sidebar { width:260px; border-right:1px solid #ddd; padding:16px; box-sizing:border-box; position:relative; }
    .main { flex:1; padding:16px; overflow:auto; }

    .label { font-weight:700; margin:12px 0 6px; }
    .list { display:flex; flex-wrap:wrap; gap:8px; }
    .btn { padding:8px 10px; border:1px solid #ccc; border-radius:10px; background:#fff; cursor:pointer; }
    .btn.active { border-color:#333; font-weight:700; }
    .muted { color:#666; font-size:14px; }

    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
    .topbar-actions { display:flex; align-items:center; gap:8px; }

    .apply {
      padding:10px 14px; border:1px solid #333; background:#333; color:#fff;
      border-radius:10px; cursor:pointer;
    }
    .apply:disabled { opacity:.5; cursor:not-allowed; }

    .refresh-btn {
      padding:10px 14px;
      border:1px solid #999;
      background:#fff;
      color:#111;
      border-radius:10px;
      cursor:pointer;
    }
    .refresh-btn:disabled {
      opacity:.5;
      cursor:not-allowed;
    }

    .material-toggle-btn {
      padding:10px 14px;
      border:1px solid #999;
      background:#fff;
      color:#111;
      border-radius:10px;
      cursor:pointer;
      font-size:14px;
      line-height:1.2;
    }
    .material-toggle-btn:hover {
      background:#f3f4f6;
    }

    table { border-collapse:collapse; width:100%; table-layout: fixed; }
    th, td {
      border-bottom:1px solid #eee;
      padding:8px 6px;
      text-align:left;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    th { position:sticky; top:0; background:#fff; border-bottom:1px solid #ddd; z-index:1; }

    th.col-class, td.col-class   { width: 90px; text-align:center; }
    th.col-name,  td.col-name    { width: 120px; }
    th.col-school,td.col-school  { width: 140px; }
    th.col-score, td.col-score   { width: 90px; text-align:center; }
    th.col-result,td.col-result  { width: 100px; text-align:center; }
    th.col-range, td.col-range   { width: 220px; }
    th.col-period,td.col-period  { width: 110px; }
    th.col-date,  td.col-date    { width: 92px; text-align:center; }
    th.col-att,   td.col-att     { width: 128px; text-align:center; }

    th.col-check, td.col-check { width: 120px; text-align:center; }

    th.col-jb, td.col-jb { width: 90px; text-align:center; }
    .jb-input{
      width: 78px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }
    .jb-input:focus{
      border-color:#333;
    }

    .score-input, .result-input{
      width: 78px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      text-align:center;
    }
    .result-input{ width: 88px; }
    .score-input:focus, .result-input:focus{
      border-color:#333;
    }

    .marks { display:flex; gap:6px; justify-content:center; }
    .m {
      padding:5px 8px;
      border:1px solid #ccc;
      border-radius:8px;
      background:#fff;
      cursor:pointer;
      line-height:1;
      user-select:none;
      transition: all 0.15s;
    }
    .m:hover{ border-color:#666; background:#f3f3f3; }
    .m.sel { border:2px solid #111; background:#e9f2ff; font-weight:700; transform:scale(1.05); }


    .att-wrap {
      display:flex;
      gap:4px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .att-btn {
      padding:6px 10px;
      border:1px solid #ccc;
      border-radius:10px;
      background:#fff;
      cursor:pointer;
      line-height:1;
      user-select:none;
      transition: all 0.15s;
      font-size:12px;
    }

    .att-btn:hover {
      border-color:#666;
      background:#f3f3f3;
    }

    .att-btn.sel {
      border:2px solid #111;
      background:#e9f2ff;
      font-weight:700;
      transform:scale(1.05);
    }

    td.pending { background: #fff6cc; }

    .science-date-wrap {
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      align-items:center;
    }

    .science-date-btn {
      padding:4px 8px;
      border:1px solid #ccc;
      border-radius:999px;
      background:#fff;
      cursor:pointer;
      font-size:12px;
      line-height:1.2;
    }

    .science-date-btn:hover {
      background:#f3f4f6;
    }

    .science-date-btn.sel {
      border:2px solid #111;
      background:#e9f2ff;
      font-weight:700;
    }

    .science-date-current {
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      background:#eef2ff;
      border:1px solid #c7d2fe;
      font-size:12px;
      line-height:1.2;
      font-weight:700;
    }

    .group-badge {
      display:inline-block;
      margin-left:6px;
      padding:2px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:700;
      line-height:1.4;
      vertical-align:middle;
    }

    .group-badge.a {
      background:#dbeafe;
      color:#1d4ed8;
      border:1px solid #93c5fd;
    }

    .group-badge.b {
      background:#ffedd5;
      color:#c2410c;
      border:1px solid #fdba74;
    }

    .sidebar-bottom {
      position:absolute;
      bottom:16px;
      left:16px;
      right:16px;
    }

    body[data-mode="class"] .recent-only { display:none; }
    body[data-mode="recent"] .class-only { display:none; }

    body.materials-collapsed .material-col { display:none; }
  
/* compact tuning */
.col-scope{max-width:220px;white-space:nowrap;}
.col-attendance{white-space:nowrap;}
.attendance-box{display:flex;gap:4px;}
.att-btn{padding:3px 8px;font-size:12px;}

</style>
</head>
<body data-mode="class">
  <div class="wrap">
    <aside class="sidebar">
      <div class="label">학년</div>
      <div class="list" id="gradeList"></div>

      <div class="label">반</div>
      <div class="list" id="classList">
        <div class="muted">학년을 선택하세요</div>
      </div>

      <div class="sidebar-bottom">
        <button class="btn" style="width:100%;" id="recentBtn">직전보강</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <div class="label" id="title">학생 명단</div>
          <div class="muted" id="status">왼쪽에서 학년/반을 선택하세요.</div>
        </div>
        <div class="topbar-actions">
          <button class="refresh-btn" id="refreshBtn" type="button">데이터 업데이트</button>
          <button class="material-toggle-btn" id="materialToggleBtn" type="button">자료 접기</button>
          <button class="apply" id="applyBtn" disabled>적용 (0)</button>
        </div>
      </div>

      <table id="table" style="display:none;">
        <thead>
          <tr>
            <th class="col-class">반명</th>
            <th class="col-name">학생명</th>
            <th class="col-school">학교</th>
            <th class="col-score">가채점</th>
            <th class="col-result">결과</th>
            <th class="col-range">시험범위</th>
            <th class="col-period">시험기간</th>
            <th class="col-date">과학일</th>
            <th class="col-att recent-only">출결</th>

            <th class="col-check material-col">오투</th>
            <th class="col-check material-col">서술형</th>
            <th class="col-check material-col">최다빈출</th>
            <th class="col-check material-col">모의고사</th>

            <th class="col-jb recent-only">직보1</th>
            <th class="col-jb recent-only">직보2</th>
            <th class="col-jb recent-only">직보3</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </main>
  </div>

<script>
  const state = {
    grade: null,
    className: null,
    pending: new Map(),
  };

  let mode = "class";

  const COL_MAP = { otwo: "G", essay: "H", freq: "I", freq_essay: "J" };
  const ATTENDANCE_COL = "O";
  const PRE_SCORE_COL = "P";
  const RESULT_COL = "Q";
  const JB_COL_MAP = { jb1: "K", jb2: "L", jb3: "M" };
  const MATERIAL_COLLAPSE_KEY = "manage_materials_collapsed_v1";

  const gradeList = document.getElementById("gradeList");
  const classList = document.getElementById("classList");
  const statusEl = document.getElementById("status");
  const titleEl = document.getElementById("title");
  const tableEl = document.getElementById("table");
  const tbodyEl = document.getElementById("tbody");
  const applyBtn = document.getElementById("applyBtn");
  const recentBtn = document.getElementById("recentBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  const materialToggleBtn = document.getElementById("materialToggleBtn");

  function setMode(m){
    mode = m;
    document.body.dataset.mode = m;
  }

  function setStatus(msg){
    statusEl.textContent = msg;
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");
  }

  function renderSchoolWithGroup(school, groupCode){
    const rawSchool = String(school || "").trim();
    const trimmedSchool = rawSchool.replace(/중학교\s*$/, "중");
    const safeSchool = escapeHtml(trimmedSchool);

    if(!groupCode) return safeSchool;

    const cls = String(groupCode).toUpperCase() === "A" ? "a" : "b";
    return `${safeSchool} <span class="group-badge ${cls}">${escapeHtml(groupCode)}</span>`;
  }

  function getGroupRuleText(rule){
    if(!rule || !rule.cutoffText) return "";

    const boundary = rule.direction === "부터"
      ? `${rule.primaryLabel}=${rule.cutoffText}부터`
      : `${rule.primaryLabel}=${rule.cutoffText}까지`;

    return `그룹 기준: ${boundary} / 그 외 ${rule.secondaryLabel}`;
  }

  function setMaterialsCollapsed(collapsed){
    document.body.classList.toggle("materials-collapsed", !!collapsed);
    if(materialToggleBtn){
      materialToggleBtn.textContent = collapsed ? "자료 펼치기" : "자료 접기";
    }
    try{
      localStorage.setItem(MATERIAL_COLLAPSE_KEY, collapsed ? "1" : "0");
    }catch(e){}
  }

  function initMaterialsCollapsed(){
    let collapsed = false;
    try{
      collapsed = localStorage.getItem(MATERIAL_COLLAPSE_KEY) === "1";
    }catch(e){}
    setMaterialsCollapsed(collapsed);
  }

  function makeScienceDayKey(grade, school){
    return `science_day:${grade}:${school}`;
  }

  function updateApplyBtn(){
    const n = state.pending.size;
    applyBtn.textContent = `적용 (${n})`;
    applyBtn.disabled = (n === 0) || (mode === "class" && (!state.grade || !state.className));
  }

  function clearPendingUI(){
    tbodyEl.querySelectorAll("td.pending").forEach(td => td.classList.remove("pending"));
  }

  function markPending(key, payload){
    state.pending.set(key, payload);
    updateApplyBtn();
  }

  function unmarkPending(key){
    state.pending.delete(key);
    updateApplyBtn();
  }

  function renderGrades(){
    gradeList.innerHTML = "";
    ["1","2","3"].forEach(g => {
      const b = document.createElement("button");
      b.className = "btn" + (state.grade === g ? " active":"");
      b.textContent = g + "학년";
      b.onclick = () => selectGrade(g);
      gradeList.appendChild(b);
    });
  }

  async function selectGrade(g){
    setMode("class");
    state.grade = g;
    state.className = null;
    state.pending.clear();
    updateApplyBtn();
    renderGrades();

    tableEl.style.display = "none";
    tbodyEl.innerHTML = "";
    titleEl.textContent = "학생 명단";
    setStatus("반 목록 불러오는 중...");

    classList.innerHTML = "";

    try {
      const res = await fetch(`/manage/api/classes?grade=${encodeURIComponent(g)}`);
      const data = await res.json();

      if(!data.ok){
        classList.innerHTML = `<div class="muted">반 목록 로드 실패</div>`;
        setStatus("오류가 발생했습니다.");
        return;
      }

      if((data.classes || []).length === 0){
        classList.innerHTML = `<div class="muted">반이 없습니다(A열 확인)</div>`;
        setStatus("반이 없습니다.");
        return;
      }

      data.classes.forEach(cn => {
        const b = document.createElement("button");
        b.className = "btn";
        b.textContent = cn;
        b.onclick = () => selectClass(cn);
        classList.appendChild(b);
      });

      setStatus("반을 선택하세요.");
    } catch (e) {
      classList.innerHTML = `<div class="muted">반 목록 로드 실패</div>`;
      setStatus("오류가 발생했습니다.");
    }
  }

  function setCellPendingByTd(td, isPending){
    td.classList.toggle("pending", !!isPending);
  }

  function renderMarkButtons_Class(sheetRow, fieldName, originalValue){
    const col = COL_MAP[fieldName];
    const marks = ["⭕","△","✕"];
    const wrap = document.createElement("div");
    wrap.className = "marks";

    let currentValue = originalValue || "";

    marks.forEach(m => {
      const btn = document.createElement("div");
      btn.className = "m" + (currentValue === m ? " sel" : "");
      btn.textContent = m;

      btn.onclick = () => {
        const alreadySelected = btn.classList.contains("sel");
        [...wrap.children].forEach(ch => ch.classList.remove("sel"));

        const key = `${sheetRow}:${col}`;

        if(alreadySelected){
          currentValue = "";
          if(currentValue === (originalValue || "")){
            unmarkPending(key);
          }else{
            markPending(key, { sheet_row: sheetRow, col, value: "" });
          }
          return;
        }

        btn.classList.add("sel");
        currentValue = m;

        if(currentValue === (originalValue || "")){
          unmarkPending(key);
        }else{
          markPending(key, { sheet_row: sheetRow, col, value: m });
        }
      };

      wrap.appendChild(btn);
    });

    return wrap;
  }



  function renderAttendanceButtons(sheetRow, originalValue, sheetName = null){
    const values = ["출석", "자료", "결석"];
    const wrap = document.createElement("div");
    wrap.className = "att-wrap";

    let currentValue = originalValue || "";

    values.forEach(value => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "att-btn" + (currentValue === value ? " sel" : "");
      btn.textContent = value;

      btn.onclick = () => {
        const alreadySelected = btn.classList.contains("sel");
        [...wrap.children].forEach(ch => ch.classList.remove("sel"));

        const key = sheetName ? `${sheetName}:${sheetRow}:${ATTENDANCE_COL}` : `${sheetRow}:${ATTENDANCE_COL}`;

        if(alreadySelected){
          currentValue = "";
          if(currentValue === (originalValue || "")){
            unmarkPending(key);
          }else{
            markPending(key, sheetName ? { sheet: sheetName, sheet_row: sheetRow, col: ATTENDANCE_COL, value: "" } : { sheet_row: sheetRow, col: ATTENDANCE_COL, value: "" });
          }
          return;
        }

        btn.classList.add("sel");
        currentValue = value;

        if(currentValue === (originalValue || "")){
          unmarkPending(key);
        }else{
          markPending(key, sheetName ? { sheet: sheetName, sheet_row: sheetRow, col: ATTENDANCE_COL, value } : { sheet_row: sheetRow, col: ATTENDANCE_COL, value });
        }
      };

      wrap.appendChild(btn);
    });

    return wrap;
  }

  function parsePeriodDates(period){
    const text = String(period || "").trim();
    const m = text.match(/^(\d{1,2})\/(\d{1,2})~(\d{1,2})\/(\d{1,2})$/);

    if(!m) return [];

    const startMonth = parseInt(m[1], 10);
    const startDay = parseInt(m[2], 10);
    const endMonth = parseInt(m[3], 10);
    const endDay = parseInt(m[4], 10);

    const start = new Date(2026, startMonth - 1, startDay);
    const end = new Date(2026, endMonth - 1, endDay);

    if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || start > end) {
      return [];
    }

    const out = [];
    const cur = new Date(start);

    while (cur <= end) {
      out.push(`${cur.getMonth() + 1}/${cur.getDate()}`);
      cur.setDate(cur.getDate() + 1);
    }

    return out;
  }

  function getPendingScienceValue(st){
    const key = makeScienceDayKey(st.grade, st.school);
    if(state.pending.has(key)){
      return String(state.pending.get(key).value || "");
    }
    return String(st.exam_date || "").trim();
  }

  function syncScienceDateCells(grade, school){
    tbodyEl.querySelectorAll(`td[data-science-school="${school}"][data-science-grade="${grade}"]`)
      .forEach(td => {
        if (td._student) {
          renderScienceDateEditor(td, td._student);
        }
      });
  }

  function renderScienceDateEditor(td, st){
    td.innerHTML = "";

    const options = parsePeriodDates(st.period);
    const savedValue = String(st.exam_date || "").trim();

    if(options.length === 0){
      td.textContent = savedValue;
      return;
    }

    const currentValue = getPendingScienceValue(st);
    const wrap = document.createElement("div");
    wrap.className = "science-date-wrap";

    if (savedValue) {
      const currentBadge = document.createElement("span");
      currentBadge.className = "science-date-current";
      currentBadge.textContent = `현재: ${savedValue}`;
      wrap.appendChild(currentBadge);
    }

    options.forEach(dateText => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = dateText;
      btn.className = "science-date-btn" + (currentValue === dateText ? " sel" : "");

      btn.onclick = () => {
        const key = makeScienceDayKey(st.grade, st.school);

        if(dateText === savedValue){
          unmarkPending(key);
        } else {
          markPending(key, {
            type: "science_day",
            grade: st.grade,
            school: st.school,
            value: dateText
          });
        }

        syncScienceDateCells(st.grade, st.school);
      };

      wrap.appendChild(btn);
    });

    td.appendChild(wrap);
    td.classList.toggle("pending", state.pending.has(makeScienceDayKey(st.grade, st.school)));
  }

  function createScienceDateCell(st){
    const td = document.createElement("td");
    td.className = "col-date";
    td.dataset.scienceSchool = st.school;
    td.dataset.scienceGrade = st.grade;
    td._student = st;
    renderScienceDateEditor(td, st);
    return td;
  }


  function renderTextInputCell(sheetRow, col, originalValue, className, sheetName = null){
    const key = sheetName ? `${sheetName}:${sheetRow}:${col}` : `${sheetRow}:${col}`;
    const input = document.createElement("input");
    input.type = "text";
    input.className = className;
    input.value = String(originalValue || "");

    const td = document.createElement("td");
    td.className = col === PRE_SCORE_COL ? "col-score" : "col-result";
    td.appendChild(input);

    function syncPending(){
      const cur = input.value;
      const orig = String(originalValue || "");
      if(cur === orig){
        unmarkPending(key);
        td.classList.remove("pending");
      }else{
        const payload = sheetName
          ? { sheet: sheetName, sheet_row: sheetRow, col, value: cur }
          : { sheet_row: sheetRow, col, value: cur };
        markPending(key, payload);
        td.classList.add("pending");
      }
    }

    input.addEventListener("input", syncPending);
    return td;
  }

  async function selectClass(cn){
    setMode("class");
    state.className = cn;
    state.pending.clear();
    updateApplyBtn();

    [...classList.querySelectorAll("button")].forEach(btn => {
      btn.classList.toggle("active", btn.textContent === cn);
    });

    titleEl.textContent = `${state.grade}학년 / ${cn}`;
    setStatus("학생 명단 불러오는 중...");
    tableEl.style.display = "none";
    tbodyEl.innerHTML = "";

    try {
      const res = await fetch(`/manage/api/students?grade=${encodeURIComponent(state.grade)}&class=${encodeURIComponent(cn)}`);
      const data = await res.json();

      if(!data.ok){
        setStatus("학생 명단 로드 실패");
        return;
      }

      const students = data.students || [];
      if(students.length === 0){
        setStatus("해당 반 학생이 없습니다(A열 필터 확인).");
        return;
      }

      tbodyEl.innerHTML = students.map(st => `
        <tr data-row="${st.sheet_row}">
          <td class="col-class">${escapeHtml(st.class || state.className)}</td>
          <td class="col-name">${escapeHtml(st.name)}</td>
          <td class="col-school">${renderSchoolWithGroup(st.school, st.group_code)}</td>
          <td class="col-score" data-pre-score="1"></td>
          <td class="col-result" data-result="1"></td>
          <td class="col-range">${escapeHtml(st.range)}</td>
          <td class="col-period">${escapeHtml(st.period)}</td>
          <td class="col-date" data-science-date="1"></td>
          <td class="col-check class-only material-col" data-field="otwo"></td>
          <td class="col-check class-only material-col" data-field="essay"></td>
          <td class="col-check class-only material-col" data-field="freq"></td>
          <td class="col-check class-only material-col" data-field="freq_essay"></td>

          <td class="col-jb recent-only"></td>
          <td class="col-jb recent-only"></td>
          <td class="col-jb recent-only"></td>
        </tr>
      `).join("");

      students.forEach(st => {
        const tr = tbodyEl.querySelector(`tr[data-row="${st.sheet_row}"]`);

        const scienceTd = tr.querySelector(`td[data-science-date="1"]`);
        const newScienceTd = createScienceDateCell(st);
        scienceTd.replaceWith(newScienceTd);

        const preScoreTd = tr.querySelector(`td[data-pre-score="1"]`);
        const newPreScoreTd = renderTextInputCell(st.sheet_row, PRE_SCORE_COL, st.pre_score, "score-input");
        preScoreTd.replaceWith(newPreScoreTd);

        const resultTd = tr.querySelector(`td[data-result="1"]`);
        const newResultTd = renderTextInputCell(st.sheet_row, RESULT_COL, st.result, "result-input");
        resultTd.replaceWith(newResultTd);

        const cells = tr.querySelectorAll(`td.col-check.class-only.material-col`);
        cells.forEach(td => {
          const field = td.getAttribute("data-field");
          const original = st[field] ?? "";
          td.classList.remove("pending");
          td.innerHTML = "";
          const wrap = renderMarkButtons_Class(st.sheet_row, field, original);
          td.appendChild(wrap);

          wrap.querySelectorAll(".m").forEach(btn => {
            btn.addEventListener("click", () => {
              const col = COL_MAP[field];
              const key = `${st.sheet_row}:${col}`;
              setCellPendingByTd(td, state.pending.has(key));
            });
          });
        });
      });

      tableEl.style.display = "";
      const groupRuleText = getGroupRuleText(data.currentGroupRule);
      setStatus(`총 ${students.length}명${groupRuleText ? " / " + groupRuleText : ""}`);
    } catch (e) {
      console.error(e);
      setStatus("학생 명단 로드 실패");
    }
  }

  function renderReadonlyMark(val){
    const s = String(val || "").trim();
    return s ? escapeHtml(s) : "";
  }

  function renderJBInput(sheet, sheetRow, fieldName, originalValue){
    const col = JB_COL_MAP[fieldName];
    const key = `${sheet}:${sheetRow}:${col}`;

    const input = document.createElement("input");
    input.type = "text";
    input.className = "jb-input";
    input.value = String(originalValue || "");

    const td = document.createElement("td");
    td.className = "col-jb recent-only";
    td.appendChild(input);

    function syncPending(){
      const cur = input.value;
      const orig = String(originalValue || "");
      if(cur === orig){
        unmarkPending(key);
        td.classList.remove("pending");
      }else{
        markPending(key, { sheet, sheet_row: sheetRow, col, value: cur });
        td.classList.add("pending");
      }
    }

    input.addEventListener("input", syncPending);
    return td;
  }

  async function loadRecent(){
    setMode("recent");
    state.pending.clear();
    updateApplyBtn();
    clearPendingUI();

    [...classList.querySelectorAll("button")].forEach(btn => btn.classList.remove("active"));

    titleEl.textContent = "직전보강 (시험기간 기준 정렬)";
    setStatus("불러오는 중...");
    tableEl.style.display = "none";
    tbodyEl.innerHTML = "";

    try {
      const res = await fetch("/manage/api/recent");
      const data = await res.json();

      if(!data.ok){
        setStatus("직전보강 로드 실패");
        return;
      }

      const students = data.students || [];
      if(students.length === 0){
        setStatus("데이터가 없습니다.");
        return;
      }

      tbodyEl.innerHTML = students.map(st => `
        <tr data-row="${st.sheet_row}" data-sheet="${st.sheet}">
          <td class="col-class">${escapeHtml(st.class)}</td>
          <td class="col-name">${escapeHtml(st.name)}</td>
          <td class="col-school">${renderSchoolWithGroup(st.school, st.group_code)}</td>
          <td class="col-score" data-pre-score="1"></td>
          <td class="col-result" data-result="1"></td>
          <td class="col-range">${escapeHtml(st.range)}</td>
          <td class="col-period">${escapeHtml(st.period)}</td>
          <td class="col-date">${escapeHtml(st.exam_date)}</td>
          <td class="col-att recent-only" data-attendance="1"></td>

          <td class="col-check material-col">${renderReadonlyMark(st.otwo)}</td>
          <td class="col-check material-col">${renderReadonlyMark(st.essay)}</td>
          <td class="col-check material-col">${renderReadonlyMark(st.freq)}</td>
          <td class="col-check material-col">${renderReadonlyMark(st.freq_essay)}</td>

          <td class="col-jb recent-only" data-jb="jb1"></td>
          <td class="col-jb recent-only" data-jb="jb2"></td>
          <td class="col-jb recent-only" data-jb="jb3"></td>
        </tr>
      `).join("");

      students.forEach(st => {
        const tr = tbodyEl.querySelector(`tr[data-row="${st.sheet_row}"][data-sheet="${st.sheet}"]`);

        const attendanceTd = tr.querySelector(`td[data-attendance="1"]`);
        if (attendanceTd) {
          attendanceTd.classList.remove("pending");
          attendanceTd.innerHTML = "";
          const attWrap = renderAttendanceButtons(st.sheet_row, st.attendance ?? "", st.sheet);
          attendanceTd.appendChild(attWrap);

          attWrap.querySelectorAll(".att-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              const key = `${st.sheet}:${st.sheet_row}:${ATTENDANCE_COL}`;
              setCellPendingByTd(attendanceTd, state.pending.has(key));
            });
          });
        }

        const preScoreTd = tr.querySelector(`td[data-pre-score="1"]`);
        const resultTd = tr.querySelector(`td[data-result="1"]`);
        if (preScoreTd) {
          const cell = renderTextInputCell(st.sheet_row, PRE_SCORE_COL, st.pre_score, "score-input", st.sheet);
          preScoreTd.replaceWith(cell);
        }
        if (resultTd) {
          const cell = renderTextInputCell(st.sheet_row, RESULT_COL, st.result, "result-input", st.sheet);
          resultTd.replaceWith(cell);
        }

        const td1 = tr.querySelector(`td[data-jb="jb1"]`);
        const td2 = tr.querySelector(`td[data-jb="jb2"]`);
        const td3 = tr.querySelector(`td[data-jb="jb3"]`);

        td1.innerHTML = "";
        td2.innerHTML = "";
        td3.innerHTML = "";

        const cell1 = renderJBInput(st.sheet, st.sheet_row, "jb1", st.jb1);
        const cell2 = renderJBInput(st.sheet, st.sheet_row, "jb2", st.jb2);
        const cell3 = renderJBInput(st.sheet, st.sheet_row, "jb3", st.jb3);

        td1.appendChild(cell1.firstChild);
        td2.appendChild(cell2.firstChild);
        td3.appendChild(cell3.firstChild);
      });

      tableEl.style.display = "";
      const groupRuleText = getGroupRuleText(data.currentGroupRule);
      setStatus(`총 ${students.length}명${groupRuleText ? " / " + groupRuleText : ""}`);
    } catch (e) {
      console.error(e);
      setStatus("직전보강 로드 실패");
    }
  }

  async function refreshManageData(){
    refreshBtn.disabled = true;

    try {
      setStatus("최신 데이터 불러오는 중...");

      const body = {};
      if (mode === "class" && state.grade) {
        body.grade = state.grade;
      }

      const res = await fetch("/manage/api/refresh", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      if(!data.ok){
        alert("업데이트 실패: " + (data.error || "unknown error"));
        setStatus("데이터 업데이트 실패");
        return;
      }

      if(mode === "recent"){
        await loadRecent();
      } else if(state.grade && state.className){
        await selectGrade(state.grade);
        await selectClass(state.className);
      } else if(state.grade){
        await selectGrade(state.grade);
      } else {
        setStatus("최신 데이터로 업데이트했습니다.");
      }

      alert("최신 데이터로 업데이트했습니다.");
    } catch (e) {
      console.error(e);
      alert("서버 통신 오류");
      setStatus("데이터 업데이트 중 오류 발생");
    } finally {
      refreshBtn.disabled = false;
    }
  }

  applyBtn.onclick = async () => {
    if (applyBtn.disabled) return;

    const changes = [...state.pending.values()];
    setStatus(`적용 중... (${changes.length}건)`);

    const body = (mode === "recent")
      ? { changes }
      : { grade: state.grade, changes };

    try{
      const res = await fetch("/manage/api/apply", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json();
      if(!data.ok){
        setStatus(`적용 실패: ${data.error || "unknown error"}`);
        return;
      }

      const applied = data.applied ?? 0;

      state.pending.clear();
      updateApplyBtn();
      clearPendingUI();

      if(mode === "recent"){
        await loadRecent();
      } else if(state.className){
        await selectClass(state.className);
      }

      setStatus(`적용 완료 (${applied}건)`);
    }catch(e){
      console.error(e);
      setStatus("적용 중 오류 발생");
    }
  };

  recentBtn.onclick = loadRecent;
  refreshBtn.onclick = refreshManageData;
  if(materialToggleBtn){
    materialToggleBtn.onclick = () => {
      const collapsed = !document.body.classList.contains("materials-collapsed");
      setMaterialsCollapsed(collapsed);
    };
  }

  renderGrades();
  updateApplyBtn();
  initMaterialsCollapsed();
</script>
</body>
</html>
